<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; background: #F6F2EA; color: #1E1B17; }
  .card { position: relative; width: 1200px; height: 630px; padding: 64px 72px; box-sizing: border-box;
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
  .mono { font-family: ui-monospace, "Cascadia Code", "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace; }
  .mark { position: absolute; top: 64px; left: 72px; display: flex; align-items: center; gap: 18px; }
  .mark svg { width: 56px; height: 56px; }
  .mark .name { font-weight: 700; font-size: 34px; letter-spacing: -0.01em; }
  .rule { position: absolute; left: 72px; right: 72px; top: 152px; height: 2px; background: #D9D0C3; }
  .rule::after { content: ""; position: absolute; left: 0; top: 0; width: 160px; height: 2px; background: #9C4A08; }
  .finding { position: absolute; left: 72px; right: 72px; top: 196px; font-size: 54px; line-height: 1.18; font-weight: 400; letter-spacing: -0.01em; }
  .foot { position: absolute; left: 72px; right: 72px; bottom: 60px; display: flex; justify-content: space-between; font-size: 22px; color: #5F5648; }
  .foot .amber { color: #9C4A08; }
</style>
</head>
<body>
<div class="card">
  <div class="mark">
    <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><rect width="32" height="32" rx="4" fill="#1E1B17"/><circle cx="13" cy="16" r="7.5" fill="none" stroke="#F6F2EA" stroke-width="3"/><rect x="20.5" y="14.5" width="9" height="3" fill="#D98A1F"/></svg>
    <span class="name mono">windlass</span>
  </div>
  <div class="rule"></div>
  <p class="finding">A pipeline runner with no model inside it. Exit 3 means it stopped and is waiting for a person.</p>
  <div class="foot mono">
    <span>human gates &middot; verifier edges &middot; one static replay per run</span>
    <span class="amber">windlass-runner.vercel.app</span>
  </div>
</div>
</body>
</html>
